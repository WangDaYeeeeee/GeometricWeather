[versions]
# Build system.
agp = "8.4.1"
kotlin = "1.9.24"
ksp = "1.9.24-1.0.20"
kotlin-compiler-extension = "1.5.14"
hilt = "2.51.1"
compose-bom = "2024.06.00"

# Lifecycle.
lifecycle = "2.8.4"

# Compose.
compose-animation = "1.6.8"
compose-foundation = "1.6.8"
compose-material = "1.6.8"
compose-material3 = "1.2.1"
compose-icons-extended = "1.6.8"
compose-ui-tooling = "1.6.8"
activity-compose = "1.9.1"
navigation-compose = "2.7.7"
accompanist = "0.35.0-alpha"

# AndroidX.
appcompat = "1.7.0"
core-ktx = "1.13.1"
material = "1.12.0"
cardview = "1.0.0"
swiperefreshlayout = "1.1.0"
preference = "1.2.1"
multidex = "2.0.1"
activity-ktx = "1.9.1"

# Work.
work = "2.9.1"

# Hilt.
hilt-work = "1.2.0"

# Network.
retrofit = "2.11.0"
okhttp = "4.12.0"

# Image.
glide = "4.16.0"

# Database.
room = "2.6.1"

# Serialization.
gson = "2.11.0"
kotlinx-serialization-json = "1.6.3"

# Async.
coroutines = "1.8.1"

# UI.
circularprogressview = "2.5.0"
colorpicker = "1.1.0"
bubbleseekbar = "3.20-lite"
adaptiveiconview = "0.0.1"
materialscrollbar = "13.3.2"
materialshetfab = "1.2.1"

# Utils.
lunarcalendar = "3.0.0"
donate = "0.1.0"

# Testing.
junit = "4.13.2"
androidx-test-core = "1.6.1"
androidx-test-runner = "1.6.2"
androidx-test-rules = "1.6.1"
mockito = "3.3.3"
powermock-api = "2.0.9"
powermock-module = "2.0.9"
powermock-classloading = "2.0.9"
robolectric = "4.13"

# Google Play Services.
gms-location = "21.3.0"

# AMap.
amap = "5.3.1"

# Bugly.
bugly-crashreport = "2.8.6.0"
bugly-native = "3.6.0.1"

[libraries]
# Kotlin.
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

# Testing.
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidx-test-rules" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
powermock-api-mockito2 = { module = "org.powermock:powermock-api-mockito2", version.ref = "powermock-api" }
powermock-module-junit4 = { module = "org.powermock:powermock-module-junit4", version.ref = "powermock-module" }
powermock-module-junit4-rule = { module = "org.powermock:powermock-module-junit4-rule", version.ref = "powermock-module" }
powermock-classloading-xstream = { module = "org.powermock:powermock-classloading-xstream", version.ref = "powermock-classloading" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# Material Design.
material = { module = "com.google.android.material:material", version.ref = "material" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }

# Compose BOM.
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material = { module = "androidx.compose.material:material", version.ref = "compose-material" }
compose-animation = { module = "androidx.compose.animation:animation", version.ref = "compose-animation" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose-ui-tooling" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose-foundation" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
compose-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "compose-icons-extended" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose-ui-tooling" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
accompanist-appcompat-theme = { module = "com.google.accompanist:accompanist-appcompat-theme", version.ref = "accompanist" }

# Preference.
preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference" }

# Core & Work.
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# Lifecycle.
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-compiler = { module = "androidx.lifecycle:lifecycle-compiler", version.ref = "lifecycle" }
lifecycle-common-java8 = { module = "androidx.lifecycle:lifecycle-common-java8", version.ref = "lifecycle" }

# Multi Dex.
multidex = { module = "androidx.multidex:multidex", version.ref = "multidex" }

# Hilt.
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "hilt-work" }
hilt-compiler-ext = { module = "androidx.hilt:hilt-compiler", version.ref = "hilt-work" }

# AMap.
amap-location = { module = "com.amap.api:location", version.ref = "amap" }

# GMS.
gms-location = { module = "com.google.android.gms:play-services-location", version.ref = "gms-location" }

# Glide.
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-ksp = { module = "com.github.bumptech.glide:ksp", version.ref = "glide" }
glide-okhttp3 = { module = "com.github.bumptech.glide:okhttp3-integration", version.ref = "glide" }

# Retrofit.
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

# Database.
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# Serialization.
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }

# Coroutines.
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# UI.
circularprogressview = { module = "com.github.rahatarmanahmed:circularprogressview", version.ref = "circularprogressview" }
colorpicker = { module = "com.jaredrummler:colorpicker", version.ref = "colorpicker" }
bubbleseekbar = { module = "com.xw.repo:bubbleseekbar", version.ref = "bubbleseekbar" }
adaptiveiconview = { module = "me.jfenn:AdaptiveIconView", version.ref = "adaptiveiconview" }
materialscrollbar = { module = "com.github.turing-tech:MaterialScrollBar", version.ref = "materialscrollbar" }
materialshetfab = { module = "com.gordonwong:material-sheet-fab", version.ref = "materialshetfab" }
activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity-ktx" }

# Utils.
lunarcalendar = { module = "com.github.XhinLiang:LunarCalendar", version.ref = "lunarcalendar" }
donate = { module = "com.github.didikee:AndroidDonate", version.ref = "donate" }

# Bugly.
bugly-crashreport = { module = "com.tencent.bugly:crashreport", version.ref = "bugly-crashreport" }
bugly-nativecrashreport = { module = "com.tencent.bugly:nativecrashreport", version.ref = "bugly-native" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

[bundles]
compose = [
    "compose-material",
    "compose-animation",
    "compose-foundation",
    "compose-material3",
    "compose-icons-extended",
    "compose-ui-tooling",
    "activity-compose",
    "navigation-compose",
    "lifecycle-viewmodel-compose",
    "accompanist-appcompat-theme",
]
lifecycle = [
    "lifecycle-viewmodel-ktx",
    "lifecycle-livedata-ktx",
    "lifecycle-runtime-ktx",
    "lifecycle-common-java8",
]
work = [
    "work-runtime",
    "work-runtime-ktx",
]
hilt = [
    "hilt-android",
    "hilt-work",
]
retrofit = [
    "retrofit",
    "retrofit-converter-gson",
]
testing = [
    "junit",
    "androidx-test-core",
    "androidx-test-runner",
    "androidx-test-rules",
    "mockito-core",
    "powermock-api-mockito2",
    "powermock-module-junit4",
    "powermock-module-junit4-rule",
    "powermock-classloading-xstream",
    "robolectric",
]